<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50%' y='65%' font-size='50' font-weight='bold' fill='%236366f1' text-anchor='middle' font-family='sans-serif'>W</text></svg>">
    <title>Wasi | Frontend Developer</title>
</head>

<body class="bg-slate-900 text-white font-serif">
    <!-- Header & NAVBAR -->
    <header class="flex space-x-2 justify-between items-center px-8 py-4 border-b border-slate-700">
        <div class="py-6 mx-4 text-2xl hover:text-indigo-400 transition-colors cursor-pointer">WASI</div>
        <div class="flex items-center space-x-6 text-2xl py-6 mx-4">
            <a href="#home" class="hover:text-indigo-400 transition-colors ">Home</a>
            <a href="#about" class="hover:text-indigo-400 transition-colors">About</a>
            <a href="#contact" class="hover:text-indigo-400 transition-colors">Contact</a>
        </div>
        <div class="flex">
            <a href="#contact"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
                Hire Me
            </a>
        </div>
    </header>

    <!-- Main -->
    <main class="flex flex-col md:flex-row items-center justify-between px-12 py-20 border-b border-slate-700">
        <!-- Left Side:-->
        <div class="max-w-xl space-y-6">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight">
                Hi, I'm <span class="text-indigo-500">Wasi</span>.
            </h1>
            <p class="text-slate-400 text-lg leading-relaxed">
                A passionate frontend developer and student based in Sindh, Pakistan. I love turning creative ideas into
                clean, modern, and responsive web experiences using HTML, CSS, JavaScript, and Tailwind CSS.
            </p>
        </div>

        <!-- Right Side -->
        <div class="mt-12 md:mt-0 relative group">
            
            <div
                class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl blur-lg opacity-75 group-hover:opacity-100 transition duration-500">
            </div>

            <!-- Image  -->
            <div
                class="relative rounded-2xl overflow-hidden border border-indigo-500/30 bg-slate-900 shadow-[0_0_25px_rgba(99,102,241,0.5)]">
                <img src="img.png.png" alt="Wasi - Frontend Developer"
                    class="w-72 md:w-80 h-auto rounded-2xl object-cover block">
            </div>
        </div>
    </main>

    <!-- footer -->
<footer class="w-full border-t border-slate-800/40 bg-transparent py-6 text-center">
    <p class="text-slate-500 text-sm font-normal">
        &copy; 2026 <span class="text-indigo-400 font-medium">Wasi</span>. All rights reserved.
    </p>
</footer>

</body>

</html>
